# Blueprint Render : https://render.com/docs/blueprint-spec
# Plan gratuit : les données sont stockées dans une base Turso (gratuite, persistante).
# Render > New > Blueprint > choisir ce dépôt GitHub, puis renseigner DATABASE_URL et DATABASE_AUTH_TOKEN.
services:
  - type: web
    name: io3-community
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # ex. libsql://io3-xxxx.turso.io
        sync: false
      - key: DATABASE_AUTH_TOKEN   # jeton Turso
        sync: false
