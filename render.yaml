# Blueprint Render : https://render.com/docs/blueprint-spec
# Render > New > Blueprint > choisir ce dépôt GitHub.
services:
  - type: web
    name: io3-community
    runtime: node
    plan: starter            # un disque persistant nécessite un plan payant
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: io3-data
      mountPath: /var/data
      sizeGB: 1
